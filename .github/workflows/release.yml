name: Release Caddy for Linux x86_64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: caddy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test server and application
        run: |
          bash tools/go.sh go mod verify
          bash tools/go.sh go test -race ./...
          node --check template/assets/app.js
      - name: Build Caddy with NaiveFox
        run: |
          GOBIN="$PWD/artifacts/bin" bash tools/go.sh go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.6
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 XCADDY="$PWD/artifacts/bin/xcaddy" bash tools/build.sh
      - name: Test the release binary
        run: |
          artifacts/bin/caddy version
          artifacts/bin/caddy list-modules --packages > artifacts/modules.txt
          grep -E '^http\.handlers\.naivefox_transport[[:space:]]+github.com/incident201/naivefox-transport' artifacts/modules.txt
          python3 - <<'PY'
          binary = open('artifacts/bin/caddy', 'rb').read()
          assert b'FIELD ATLAS / OBSERVATORY' not in binary
          assert b'A small window into a changing world.' not in binary
          PY
          NAIVEFOX_CADDY_BIN="$PWD/artifacts/bin/caddy" bash tools/go.sh go test -race -run 'TestCombinedCaddy(TLS|RejectsInvalidExternalApplication)' -count=1 .
      - name: Prepare binary, checksum, and provenance
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="caddy-$(date -u +%Y%m%d)-${SOURCE_SHA:0:12}"
          if [[ "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 2
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          mkdir dist
          install -m 755 artifacts/bin/caddy dist/caddy-linux-amd64
          (cd dist && sha256sum caddy-linux-amd64 > caddy-linux-amd64.sha256)
          if find template -type l -print -quit | grep -q .; then
            printf 'template archive must not contain symlinks\n' >&2
            exit 1
          fi
          make_template_archive() {
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -C template -cf - . | gzip -n
          }
          make_template_archive > dist/naivefox-application-template.tar.gz
          make_template_archive > dist/naivefox-application-template.second.tar.gz
          cmp dist/naivefox-application-template.tar.gz dist/naivefox-application-template.second.tar.gz
          rm dist/naivefox-application-template.second.tar.gz
          (cd dist && sha256sum naivefox-application-template.tar.gz > naivefox-application-template.tar.gz.sha256)
          mkdir dist/template-check
          tar -xzf dist/naivefox-application-template.tar.gz -C dist/template-check
          diff -qr template dist/template-check
          rm -rf dist/template-check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          binary = pathlib.Path('dist/caddy-linux-amd64')
          template = pathlib.Path('dist/naivefox-application-template.tar.gz')
          build_info = subprocess.check_output(['go', 'version', '-m', str(binary)], text=True).splitlines()
          assert not any('forwardproxy' in line for line in build_info), 'classic forwardproxy must not be linked'
          data = {
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['SOURCE_SHA'],
              'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'platform': 'linux/amd64', 'cgo_enabled': False,
              'caddy': 'v2.11.2', 'xcaddy': 'v0.4.6',
              'go': subprocess.check_output(['go', 'version'], text=True).strip(),
              'go_build_info': build_info,
              'binary': binary.name,
              'sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
              'application_template': template.name,
              'application_template_sha256': hashlib.sha256(template.read_bytes()).hexdigest(),
              'application_template_contract': 'naivefox-application-v2',
              'application_template_files': {
                  str(path.relative_to('template')): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(pathlib.Path('template').rglob('*')) if path.is_file()
              },
              'modules': pathlib.Path('artifacts/modules.txt').read_text().splitlines(),
          }
          pathlib.Path('dist/build-info.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: caddy-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caddy-linux-amd64
          path: dist
      - name: Publish tested binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check caddy-linux-amd64.sha256)
          (cd dist && sha256sum --check naivefox-application-template.tar.gz.sha256)
          cat > release-notes.md <<EOF
          Caddy 2.11.2 for Linux x86_64 with the single current NaiveFox transport.

          Configure basic_auth and destination policy directly inside naivefox_transport. Client and server must be updated together; classic NaiveProxy and old wire versions are not supported.

          Set application_root to one absolute directory containing the complete public site. The server derives startup resources from index.html and serves their actual bytes from an immutable memory snapshot. There are no compulsory CSS/JS/image filenames, resource counts, manifest files or padding sizes. Other files remain available from disk on GET/HEAD.

          The native client loads every distinct supported directly declared resource, at most six at a time, without enabling caching or crawling CSS/JavaScript dependencies. Site size is the author's choice; large directly declared files increase traffic for every new carrier and server snapshot memory. Reload after changing the root or a selected file. Invalid or incomplete sites reject validation.

          See the [site requirements and size recommendations](https://github.com/$GH_REPO/blob/$SOURCE_SHA/docs/SITE.md) and [complete Caddyfile](https://github.com/$GH_REPO/blob/$SOURCE_SHA/README.md#build-and-configure).

          H2 uses native WSS/TCP after the site and twenty-pair startup. H3 remains on QUIC with a persistent HTTP/3 GET and bounded POST pipeline. Public responses contain no transport metadata. Authentication and the shared site identity are verified before OPEN.

          Source commit: $SOURCE_SHA. Go 1.25.12, xcaddy 0.4.6; the exact module list and binary checksum are recorded in build-info.json.

          Download the binary and application template with both checksum files and verify each with sha256sum --check. Customize the template, add the rest of your site into the same directory and follow the README for installation. Keep the existing certificate storage and configure the service to use the combined binary.

          Build and runtime checks passed in this workflow before publication.
          EOF
          gh release create "$RELEASE_TAG" \
            dist/caddy-linux-amd64 dist/caddy-linux-amd64.sha256 \
            dist/naivefox-application-template.tar.gz \
            dist/naivefox-application-template.tar.gz.sha256 \
            dist/build-info.json \
            --target "$SOURCE_SHA" --title "Caddy 2.11.2 + NaiveFox transport ($RELEASE_TAG)" \
            --notes-file release-notes.md --latest
